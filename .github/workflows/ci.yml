name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-chi-sim
          rustup update stable
          ./scripts/fetch-pdfium.sh
      - name: Test Rust workspace
        env:
          PDFIUM_LIB_PATH: ${{ github.workspace }}/.deps/pdfium/lib/libpdfium.so
          TESSERACT_PATH: /usr/bin/tesseract
        run: cargo +stable test --workspace --locked
      - name: Build frontend
        working-directory: app
        run: |
          npm ci
          npm run build
      - name: Build Windows x64 portable ZIP
        if: github.ref_type == 'tag'
        env:
          RUSTUP_TOOLCHAIN: stable
          MINGW_ROOT: /
        run: |
          sudo apt-get install -y gcc-mingw-w64-x86-64-posix g++-mingw-w64-x86-64-posix cabextract
          rustup target add x86_64-pc-windows-gnu
          ./scripts/build-tesseract-windows.sh
          ./scripts/fetch-windows-runtime.sh
          ./scripts/build-windows.sh
          cd target
          unzip -tq IndexFox-windows-x64-portable.zip
          sha256sum IndexFox-windows-x64-portable.zip > IndexFox-windows-x64-portable.zip.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.ref_type == 'tag'
        with:
          name: windows-x64-portable
          path: |
            target/IndexFox-windows-x64-portable.zip
            target/IndexFox-windows-x64-portable.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-x64-portable
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum --check IndexFox-windows-x64-portable.zip.sha256
          args=(--verify-tag --generate-notes)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" "${args[@]}" \
            IndexFox-windows-x64-portable.zip IndexFox-windows-x64-portable.zip.sha256
